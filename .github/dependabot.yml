version: 2
updates:
  # Go modules. The GCP client libraries pull in many modules, so updates are
  # grouped to keep them to a couple of PRs per week instead of dozens.
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      google-cloud:
        patterns:
          - "cloud.google.com/go*"
          - "google.golang.org/*"
      go-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "cloud.google.com/go*"
          - "google.golang.org/*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
