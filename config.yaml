server:
  port: 9090
  metrics_path: /metrics
  health_path: /health

collection:
  interval: 300s
  timeout: 120s

gcp:
  # The project to monitor. Credentials come from Application Default
  # Credentials (Workload Identity on GKE, or GOOGLE_APPLICATION_CREDENTIALS).
  project_id: ""

# Resource counts via Cloud Asset Inventory (free). Requires roles/cloudasset.viewer.
assets:
  enabled: true
  include_types: []   # empty = all asset types; else e.g. ["compute.googleapis.com/Instance"]
  exclude_types: []

# Cost via the BigQuery billing export (GCP analog of AWS CUR).
# Requires roles/bigquery.dataViewer + roles/bigquery.jobUser and a billing
# export configured to a BigQuery dataset.
billing:
  enabled: false
  billing_project_id: ""              # project hosting the export dataset; defaults to gcp.project_id
  dataset: ""                         # e.g. billing
  table: ""                           # e.g. gcp_billing_export_v1_0123AB_4567CD_89EF01
  location: US                        # BigQuery dataset location
  max_skus: 100                       # cap on per-SKU series (top N by cost)

logging:
  level: info
  format: json
